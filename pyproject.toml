[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocoin"
version = "0.2.0"
description = "AI 기반 암호화폐 자동매매 시스템"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "mplfinance>=0.12",
    "pandas>=2.0",
    "PyJWT>=2.8",
    "redis[hiredis]>=5.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pre-commit", "ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
