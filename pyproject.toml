[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocoin"
version = "0.1.0"
description = "빈 뼈대 — 여기서 다시 설계"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
]

[project.scripts]
autocoin-api = "app:main"

[project.optional-dependencies]
dev = ["pre-commit", "ruff"]

[tool.hatch.build.targets.wheel]
packages = [
  "src/bithumb",
  "src/models",
  "src/schemas",
  "src/services",
  "src/routers",
  "src/utils",
  "src/worker",
]

[tool.hatch.build.targets.wheel.force-include]
"src/app.py" = "app.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
