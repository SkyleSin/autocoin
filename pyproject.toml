[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocoin"
version = "0.1.0"
description = "빈 뼈대 — 여기서 다시 설계"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
    "mplfinance>=0.12",
    "pandas>=2.0",
    "PyJWT>=2.8",
    "redis[hiredis]>=5.0",
    "cryptography>=42.0",
]

[project.scripts]
autocoin-api = "app:main"

[project.optional-dependencies]
dev = ["pre-commit", "ruff"]

[tool.hatch.build.targets.wheel]
packages = [
  "shared/core",
  "shared/infra",
  "shared/job_runner",
  "shared/bithumb",
  "shared/models",
  "shared/services",
  "shared/utils",
  "ct-api/src/routers",
  "ct-api/src/schemas",
  "ct-telegram/src/telegram",
]

[tool.hatch.build.targets.wheel.force-include]
"ct-api/src/app.py" = "app.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
