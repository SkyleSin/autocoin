[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocoin"
version = "0.1.0"
description = "빗썸 연동 자동매매 서버"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyJWT>=2.8",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = ["pre-commit", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["autocoin"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
