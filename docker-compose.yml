services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autocoin
      POSTGRES_PASSWORD: autocoin
      POSTGRES_DB: autocoin
    volumes:
      - autocoin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocoin -d autocoin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # 호스트에서 psql 등으로 붙으려면 유지, 내부 전용이면 아래 ports 제거
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # 컨테이너 간 통신: 서비스 이름 db 가 호스트명
      DATABASE_URL: postgresql+asyncpg://autocoin:***REMOVED***@db:5432/autocoin
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  autocoin_pgdata:
