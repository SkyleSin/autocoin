# DB 컨테이너 DNS 이름 = 아래 서비스 키(예: ct-db). 키를 바꾸면 POSTGRES_INTERNAL_HOST 기본값도 같이 바꿀 것.
services:
  ct-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autocoin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autocoin}
      POSTGRES_DB: ${POSTGRES_DB:-autocoin}
    volumes:
      - /cache/autocoin/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"

  ct-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # .env의 DATABASE_URL(127.0.0.1)보다 우선. 호스트는 DB 서비스 이름과 동일하게(기본: ct-db)
      POSTGRES_INTERNAL_HOST: ${POSTGRES_INTERNAL_HOST:-ct-db}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+asyncpg://${POSTGRES_USER:-autocoin}:${POSTGRES_PASSWORD:-autocoin}@${POSTGRES_INTERNAL_HOST:-ct-db}:5432/${POSTGRES_DB:-autocoin}}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
    env_file:
      - path: .env
        required: false
    volumes:
      - ./log:/app/log
    ports:
      - "${API_PUBLISH_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      ct-db:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes: {}
