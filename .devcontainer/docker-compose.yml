# Dev Container 전용 DB + 개발 컨테이너 (루트 compose / 볼륨과 분리)
# DB 계정은 개발 편의상 고정(autocoin). 프로덕션 compose 의 .env 와 다를 수 있음.
services:
  ct-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autocoin
      POSTGRES_PASSWORD: autocoin
      POSTGRES_DB: autocoin
    volumes:
      - devcontainer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocoin -d autocoin"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devcontainer_internal
    ports:
      - "${DEVCONTAINER_POSTGRES_PORT:-5433}:5432"

  ct-dev:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://autocoin:***REMOVED***@ct-db:5432/autocoin
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      ct-db:
        condition: service_healthy
    networks:
      - devcontainer_internal

networks:
  devcontainer_internal:
    driver: bridge

volumes:
  devcontainer_pgdata:
